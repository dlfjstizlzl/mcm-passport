spring:
  application:
    name: passport
  config:
    import: optional:classpath:application-secret.yml
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/mcm_passport}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    url: /openapi.yaml
    disable-swagger-default-url: true

mcm:
  cors:
    allowed-origins: ${MCM_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,https://hackathonfront.devdlfjstizlzl.xyz}
  reference-data:
    enabled: ${MCM_REFERENCE_DATA_ENABLED:true}
  style:
    analysis:
      provider: ${MCM_STYLE_ANALYSIS_PROVIDER:mock}
      openai:
        api-key: ${OPENAI_API_KEY:}
        model: ${OPENAI_MODEL:}
        reasoning-effort: ${MCM_OPENAI_REASONING_EFFORT:none}
        timeout: ${OPENAI_TIMEOUT:30s}
