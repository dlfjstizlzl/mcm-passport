openapi: 3.1.0
info:
  title: MCM Passport API
  version: 1.0.0
  description: |
    MCM Passport의 프론트엔드 연동 기준 계약입니다.
    BE1 Journey/Boarding 및 BE2 Style/Result API를 노션 명세 기준으로 정의합니다.
servers:
  - url: /
    description: 현재 서버
tags:
  - name: Passport Session
  - name: Journey
  - name: Product
  - name: Boarding Pass
  - name: Style Spot
  - name: Style Result
  - name: Style Portrait
  - name: Journey Souvenir
  - name: My Passport
paths:
  /api/passport-sessions:
    post:
      tags: [Passport Session]
      summary: Passport Session 생성
      operationId: createPassportSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PassportSessionCreateRequest'
      responses:
        '201':
          description: 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassportSessionCreateResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/passport-sessions/{passportSessionId}:
    parameters:
      - $ref: '#/components/parameters/PassportSessionId'
    get:
      tags: [Passport Session]
      summary: Passport Session 조회
      operationId: getPassportSession
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassportSessionResponse'
        '404': {$ref: '#/components/responses/NotFound'}
  /api/passport-sessions/{passportSessionId}/journey:
    parameters:
      - $ref: '#/components/parameters/PassportSessionId'
    get:
      tags: [Journey]
      summary: Journey 진행 상태 조회
      operationId: getJourneyProgress
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JourneyProgressResponse'
        '404': {$ref: '#/components/responses/NotFound'}
  /api/journey-spots:
    get:
      tags: [Journey]
      summary: Journey Spot 목록 조회
      operationId: getJourneySpots
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JourneySpotResponse'
  /api/journey-spots/{journeySpotId}:
    parameters:
      - $ref: '#/components/parameters/JourneySpotId'
    get:
      tags: [Journey]
      summary: Journey Spot 및 Guide 질문 조회
      operationId: getJourneySpot
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JourneySpotDetailResponse'
        '404': {$ref: '#/components/responses/NotFound'}
  /api/passport-sessions/{passportSessionId}/guide-responses/{questionId}:
    parameters:
      - $ref: '#/components/parameters/PassportSessionId'
      - $ref: '#/components/parameters/QuestionId'
    put:
      tags: [Journey]
      summary: Guide 답변 저장 또는 수정
      operationId: upsertGuideResponse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuideResponseRequest'
      responses:
        '200':
          description: 저장 또는 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuideResponseResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/passport-sessions/{passportSessionId}/journey-spots/{journeySpotId}/complete:
    parameters:
      - $ref: '#/components/parameters/PassportSessionId'
      - $ref: '#/components/parameters/JourneySpotId'
    post:
      tags: [Journey]
      summary: Journey Spot 완료 및 Stamp 발급
      operationId: completeJourneySpot
      responses:
        '201':
          description: Stamp 발급 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JourneyStampResponse'
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/products/{productId}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [Product]
      summary: Product 조회
      operationId: getProduct
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404': {$ref: '#/components/responses/NotFound'}
  /api/passport-sessions/{passportSessionId}/product-tags:
    parameters:
      - $ref: '#/components/parameters/PassportSessionId'
    post:
      tags: [Product]
      summary: Product 태그
      operationId: createProductTag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductTagCreateRequest'
      responses:
        '201':
          description: 태그 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductTagCreateResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    get:
      tags: [Product]
      summary: 태그한 Product 목록 조회
      operationId: getProductTags
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductTagListResponse'
        '404': {$ref: '#/components/responses/NotFound'}
  /api/passport-sessions/{passportSessionId}/boarding-pass:
    parameters:
      - $ref: '#/components/parameters/PassportSessionId'
    post:
      tags: [Boarding Pass]
      summary: Boarding Pass 발급
      operationId: issueBoardingPass
      responses:
        '201':
          description: 발급 성공. 이미 발급된 경우 기존 Boarding Pass를 반환합니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardingPassIssueResponse'
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    get:
      tags: [Boarding Pass]
      summary: Boarding Pass 조회
      operationId: getBoardingPass
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardingPassResponse'
        '404': {$ref: '#/components/responses/NotFound'}
  /api/style-spots/{styleSpotId}/connect:
    parameters:
      - $ref: '#/components/parameters/StyleSpotId'
    post:
      tags: [Style Spot]
      summary: Passport와 Style Spot 연결
      description: |
        READY_TO_BOARD 상태의 Passport Session을 Style Spot에 연결하고, Journey 데이터를 분석하여
        Style Result 생성까지 한 번에 완료합니다. FE가 별도의 Analysis API를 호출할 필요는 없습니다.

        같은 Passport Session이 이미 이 Spot의 활성 연결을 소유하면 기존 StyleSpotSession을 재사용합니다.
        분석 실패 후 Spot이 CONNECTED로 복구된 경우 같은 요청으로 분석을 재시도할 수 있으며,
        성공 후 재호출하면 기존 결과를 200으로 반환합니다. 다른 Passport Session이 사용 중이면 409입니다.
      operationId: connectStyleSpot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StyleSpotConnectRequest'
      responses:
        '200':
          description: 연결, 분석 및 Style Result 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StyleSpotConnectResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /api/style-spot-sessions/{styleSpotSessionId}/disconnect:
    parameters:
      - $ref: '#/components/parameters/StyleSpotSessionId'
    post:
      tags: [Style Spot]
      summary: Style Spot 연결 해제
      description: |
        활성 연결을 해제하고 Style Spot을 RESET 상태로 전환합니다. 이미 해제된 Session을 다시 요청하면
        기존 DISCONNECTED 응답을 200으로 반환합니다. Result 생성 전에는 STYLE_SPOT 상태의 Passport Session이
        READY_TO_BOARD로 복구될 수 있지만, Result 생성 후에는 STYLE_SPOT을 유지하고 Souvenir 생성 후에는
        COMPLETED를 유지합니다.
      operationId: disconnectStyleSpot
      responses:
        '200':
          description: 연결 해제 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StyleSpotSessionResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /api/style-spots/{styleSpotId}/display:
    parameters:
      - $ref: '#/components/parameters/StyleSpotId'
    get:
      tags: [Style Spot]
      summary: Display 상태 및 결과 조회
      description: |
        현재 Style Spot의 상태와 활성 Session 및 결과를 단일한 flat 응답으로 반환합니다.
        WAITING/RESET에서는 activeStyleSpotSessionId와 styleResult가 null이고,
        CONNECTED/ANALYZING에서는 activeStyleSpotSessionId만 존재하며,
        RESULT에서는 두 값이 모두 존재합니다.
      operationId: getStyleSpotDisplay
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StyleSpotDisplayResponse'
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /api/passport-sessions/{passportSessionId}/style-result:
    parameters:
      - $ref: '#/components/parameters/PassportSessionId'
    get:
      tags: [Style Result]
      summary: Style Result 조회
      operationId: getStyleResult
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StyleResultResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /api/passport-sessions/{passportSessionId}/portrait:
    parameters:
      - $ref: '#/components/parameters/PassportSessionId'
    post:
      tags: [Style Portrait]
      summary: Style Portrait 저장
      operationId: createStylePortrait
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StylePortraitRequest'
      responses:
        '201':
          description: 저장 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StylePortraitResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalServerError'}
    get:
      tags: [Style Portrait]
      summary: Style Portrait 조회
      operationId: getStylePortrait
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StylePortraitResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
    delete:
      tags: [Style Portrait]
      summary: Style Portrait 삭제
      operationId: deleteStylePortrait
      responses:
        '204':
          description: 삭제 성공
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /api/passport-sessions/{passportSessionId}/souvenir:
    parameters:
      - $ref: '#/components/parameters/PassportSessionId'
    post:
      tags: [Journey Souvenir]
      summary: Journey Souvenir 생성
      description: |
        Style Result를 기반으로 Journey Souvenir를 생성하고, 최초 생성 시 같은 transaction에서
        Passport Session을 COMPLETED로 전환합니다. Portrait은 선택 기능이며 선행 조건이 아닙니다.
        이미 생성된 Souvenir가 있으면 새로 만들지 않고 기존 리소스를 200으로 반환합니다.
      operationId: createJourneySouvenir
      responses:
        '201':
          description: 최초 생성 성공 및 Passport Session COMPLETED 전환
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JourneySouvenirResponse'
        '200':
          description: 이미 생성된 Journey Souvenir 반환
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JourneySouvenirResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalServerError'}
    get:
      tags: [Journey Souvenir]
      summary: Journey Souvenir 조회
      operationId: getJourneySouvenir
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JourneySouvenirResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
  /api/passport-sessions/{passportSessionId}/my-passport:
    parameters:
      - $ref: '#/components/parameters/PassportSessionId'
    get:
      tags: [My Passport]
      summary: My Passport aggregate 조회
      description: |
        Passport Session이 존재하면 COMPLETED 이전에도 현재까지 축적된 Journey, Style Result,
        선택적 Portrait 및 Souvenir를 partial aggregate로 반환합니다.
      operationId: getMyPassport
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyPassportResponse'
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalServerError'}
components:
  parameters:
    PassportSessionId:
      name: passportSessionId
      in: path
      required: true
      schema: {type: integer, format: int64}
    JourneySpotId:
      name: journeySpotId
      in: path
      required: true
      schema: {type: integer, format: int64}
    QuestionId:
      name: questionId
      in: path
      required: true
      schema: {type: integer, format: int64}
    ProductId:
      name: productId
      in: path
      required: true
      schema: {type: integer, format: int64}
    StyleSpotId:
      name: styleSpotId
      in: path
      required: true
      description: Style Spot의 숫자 PK가 아닌 대소문자를 구분하지 않는 코드입니다.
      schema:
        type: string
        example: GATE-S1
    StyleSpotSessionId:
      name: styleSpotSessionId
      in: path
      required: true
      schema: {type: integer, format: int64}
  responses:
    BadRequest:
      description: 입력 validation 실패(INVALID_INPUT) 또는 JSON 본문 해석 실패(MALFORMED_JSON)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    NotFound:
      description: 리소스를 찾을 수 없음
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Conflict:
      description: 현재 상태에서 요청을 처리할 수 없음
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    UnsupportedMediaType:
      description: 지원하지 않는 요청 Content-Type(UNSUPPORTED_MEDIA_TYPE)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    InternalServerError:
      description: 서버 내부 오류(INTERNAL_SERVER_ERROR)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
  schemas:
    PassportSessionCreateRequest:
      type: object
      required: [cardUid]
      properties:
        cardUid: {type: string, example: MCM-PASSPORT-001}
    PassportSessionCreateResponse:
      type: object
      required: [passportSessionId, status, startedAt]
      properties:
        passportSessionId: {type: integer, format: int64, example: 17}
        status: {$ref: '#/components/schemas/PassportSessionStatus'}
        startedAt: {type: string, format: date-time}
    PassportSessionResponse:
      allOf:
        - $ref: '#/components/schemas/PassportSessionCreateResponse'
        - type: object
          properties:
            completedAt: {type: [string, 'null'], format: date-time}
    PassportSessionStatus:
      type: string
      enum: [EXPLORING, READY_TO_BOARD, STYLE_SPOT, COMPLETED]
    JourneyProgressResponse:
      type: object
      required: [passportSessionId, status, spots]
      properties:
        passportSessionId: {type: integer, format: int64}
        status: {$ref: '#/components/schemas/PassportSessionStatus'}
        spots:
          type: array
          items: {$ref: '#/components/schemas/JourneyProgressSpot'}
    JourneyProgressSpot:
      type: object
      required: [id, code, name, sequence, required, completed]
      properties:
        id: {type: integer, format: int64}
        code: {type: string, example: ORIGIN_GATE}
        name: {type: string, example: Origin Gate}
        sequence: {type: integer, example: 1}
        required: {type: boolean, example: true}
        completed: {type: boolean, example: true}
        stampedAt: {type: [string, 'null'], format: date-time}
    JourneySpotResponse:
      type: object
      required: [id, code, name, sequence, required]
      properties:
        id: {type: integer, format: int64}
        code: {type: string}
        name: {type: string}
        description: {type: [string, 'null']}
        sequence: {type: integer}
        required: {type: boolean}
    JourneySpotDetailResponse:
      type: object
      required: [id, code, name, questions]
      properties:
        id: {type: integer, format: int64}
        code: {type: string}
        name: {type: string}
        questions:
          type: array
          items: {$ref: '#/components/schemas/GuideQuestion'}
    GuideQuestion:
      type: object
      required: [id, code, questionText, required, sequence, options]
      properties:
        id: {type: integer, format: int64}
        code: {type: string}
        questionText: {type: string}
        required: {type: boolean}
        sequence: {type: integer}
        options:
          type: array
          items: {$ref: '#/components/schemas/GuideOption'}
    GuideOption:
      type: object
      required: [id, code, label, sequence]
      properties:
        id: {type: integer, format: int64}
        code: {type: string}
        label: {type: string}
        sequence: {type: integer}
    GuideResponseRequest:
      type: object
      description: optionId 또는 answerText 중 하나는 필수입니다.
      properties:
        optionId: {type: [integer, 'null'], format: int64}
        answerText: {type: [string, 'null'], maxLength: 500}
    GuideResponseResponse:
      type: object
      required: [guideResponseId, questionId, optionId, answeredAt]
      properties:
        guideResponseId: {type: integer, format: int64}
        questionId: {type: integer, format: int64}
        optionId: {type: [integer, 'null'], format: int64}
        answerText: {type: [string, 'null']}
        answeredAt: {type: string, format: date-time}
    JourneyStampResponse:
      type: object
      required: [journeyStampId, journeySpotId, stampedAt]
      properties:
        journeyStampId: {type: integer, format: int64}
        journeySpotId: {type: integer, format: int64}
        stampedAt: {type: string, format: date-time}
    ProductResponse:
      type: object
      required: [id, name, category, recommendable]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        category: {type: string}
        description: {type: [string, 'null'], maxLength: 1000}
        color: {type: [string, 'null']}
        material: {type: [string, 'null']}
        silhouette: {type: [string, 'null']}
        imageUrl: {type: [string, 'null'], format: uri}
        recommendable: {type: boolean}
    ProductTagCreateRequest:
      type: object
      required: [productId]
      properties:
        productId: {type: integer, format: int64}
    ProductTagCreateResponse:
      type: object
      required: [productTagId, product, taggedAt]
      properties:
        productTagId: {type: integer, format: int64}
        product: {$ref: '#/components/schemas/TaggedProduct'}
        taggedAt: {type: string, format: date-time}
    TaggedProduct:
      type: object
      required: [id, name, category]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        category: {type: string}
        description: {type: [string, 'null'], maxLength: 1000}
        color: {type: [string, 'null']}
        material: {type: [string, 'null']}
        silhouette: {type: [string, 'null']}
        imageUrl: {type: [string, 'null'], format: uri}
    ProductTagListResponse:
      type: object
      required: [productId, name, taggedAt]
      properties:
        productId: {type: integer, format: int64}
        name: {type: string}
        taggedAt: {type: string, format: date-time}
    BoardingPassIssueResponse:
      type: object
      required: [boardingPassId, passportSessionId, gate, issuedAt]
      properties:
        boardingPassId: {type: integer, format: int64}
        passportSessionId: {type: integer, format: int64}
        gate: {type: string, example: STYLE_SPOT}
        issuedAt: {type: string, format: date-time}
    BoardingPassResponse:
      type: object
      required: [boardingPassId, gate, issuedAt]
      properties:
        boardingPassId: {type: integer, format: int64}
        gate: {type: string, example: STYLE_SPOT}
        issuedAt: {type: string, format: date-time}
    StyleSpotConnectRequest:
      type: object
      required: [passportSessionId]
      properties:
        passportSessionId: {type: integer, format: int64, example: 17}
    StyleSpotConnectResponse:
      type: object
      description: Connect 한 번으로 연결과 분석이 완료된 결과입니다.
      required: [styleSpotSessionId, styleSpotId, passportSessionId, status, styleResult]
      properties:
        styleSpotSessionId: {type: integer, format: int64}
        styleSpotId: {type: string, example: GATE-S1}
        passportSessionId: {type: integer, format: int64}
        status:
          type: string
          enum: [RESULT]
          description: 정상 응답에서는 분석과 결과 저장이 완료되었으므로 항상 RESULT입니다.
        styleResult: {$ref: '#/components/schemas/StyleResultResponse'}
    StyleSpotSessionResponse:
      type: object
      description: 연결 해제 후의 StyleSpotSession snapshot입니다.
      required: [id, styleSpotId, passportSessionId, status, connectedAt, disconnectedAt]
      properties:
        id: {type: integer, format: int64}
        styleSpotId: {type: string, example: GATE-S1}
        passportSessionId: {type: integer, format: int64}
        status: {type: string, enum: [DISCONNECTED]}
        connectedAt: {type: string, format: date-time}
        disconnectedAt: {type: string, format: date-time}
    StyleSpotDisplayResponse:
      type: object
      description: |
        모든 Display 상태에서 같은 JSON 구조를 사용합니다.
        WAITING/RESET: activeStyleSpotSessionId=null, styleResult=null
        CONNECTED/ANALYZING: activeStyleSpotSessionId!=null, styleResult=null
        RESULT: activeStyleSpotSessionId!=null, styleResult!=null
      required: [styleSpotId, activeStyleSpotSessionId, status, styleResult]
      properties:
        styleSpotId: {type: string, example: GATE-S1}
        activeStyleSpotSessionId:
          type: [integer, 'null']
          format: int64
        status: {$ref: '#/components/schemas/StyleSpotStatus'}
        styleResult:
          oneOf:
            - $ref: '#/components/schemas/StyleResultResponse'
            - type: 'null'
    StyleSpotStatus:
      type: string
      enum: [WAITING, CONNECTED, ANALYZING, RESULT, RESET]
    StyleResultResponse:
      type: object
      required:
        - id
        - passportSessionId
        - cityCode
        - cityCodeName
        - recommendedProductCode
        - recommendedProductName
        - recommendedProductImageUrl
        - styleMood
        - styleMoodName
        - backgroundCode
        - backgroundName
        - backgroundAssetKey
        - description
        - matchScore
        - usedFallback
        - createdAt
      properties:
        id: {type: integer, format: int64}
        passportSessionId: {type: integer, format: int64}
        cityCode: {$ref: '#/components/schemas/CityCode'}
        cityCodeName: {type: string, example: Berlin Afterdark Nomad}
        recommendedProductCode: {$ref: '#/components/schemas/RecommendedProductCode'}
        recommendedProductName: {type: string, example: Stark Backpack}
        recommendedProductImageUrl:
          type: [string, 'null']
          format: uri
          maxLength: 1000
        styleMood: {$ref: '#/components/schemas/StyleMoodCode'}
        styleMoodName: {type: string}
        backgroundCode: {$ref: '#/components/schemas/CityBackgroundCode'}
        backgroundName: {type: string}
        backgroundAssetKey: {type: string}
        description: {type: string, minLength: 1, maxLength: 1000}
        matchScore: {type: integer, minimum: 0, maximum: 100}
        usedFallback:
          type: boolean
          description: true여도 API 실패가 아니며 Rule-based fallback으로 결과 생성을 정상 완료했다는 뜻입니다.
        createdAt: {type: string, format: date-time}
    CityCode:
      type: string
      enum:
        - BERLIN_AFTERDARK_NOMAD
        - TOKYO_QUIET_MINIMALIST
        - SEOUL_NEON_PLAYER
        - MUNICH_HERITAGE_TRAVELER
        - NEWYORK_GRAPHIC_MOVER
        - HONG_KONG_NEON_NAVIGATOR
        - SHANGHAI_FUTURE_VOYAGER
    RecommendedProductCode:
      type: string
      enum: [STARK_BACKPACK, AREN_CROSSBODY, DIAMANT_3D_SHOULDER_BAG]
    StyleMoodCode:
      type: string
      enum: [AFTERDARK_MOVEMENT, CREATIVE_PULSE, MODERN_ELEGANCE]
    CityBackgroundCode:
      type: string
      enum:
        - BERLIN_AFTER_DARK
        - TOKYO_QUIET_LINE
        - SEOUL_PULSE
        - MUNICH_HERITAGE
        - NEW_YORK_GRAPHIC_CITY
        - HONG_KONG_NEON_HARBOR
        - SHANGHAI_FUTURE_SKYLINE
    StylePortraitRequest:
      type: object
      required: [imageUrl, consent]
      properties:
        imageUrl:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: '.*\S.*'
          description: 비어 있지 않은 storage/CDN reference입니다. 절대 URI 형식으로 제한하지 않습니다.
        consent:
          type: boolean
          const: true
          description: Portrait 저장에 대한 명시적 동의이며 true만 허용합니다.
    StylePortraitResponse:
      type: object
      required: [id, passportSessionId, imageUrl, consent, createdAt]
      properties:
        id: {type: integer, format: int64}
        passportSessionId: {type: integer, format: int64}
        imageUrl: {type: string, minLength: 1, maxLength: 1000, pattern: '.*\S.*'}
        consent: {type: boolean}
        createdAt: {type: string, format: date-time}
    JourneySouvenirResponse:
      type: object
      required:
        - id
        - passportSessionId
        - styleResultId
        - cityCode
        - cityCodeName
        - recommendedProductCode
        - recommendedProductName
        - styleMood
        - styleMoodName
        - backgroundCode
        - backgroundName
        - backgroundAssetKey
        - journeyStamps
        - taggedProductCodes
        - createdAt
      properties:
        id: {type: integer, format: int64}
        passportSessionId: {type: integer, format: int64}
        styleResultId: {type: integer, format: int64}
        cityCode: {$ref: '#/components/schemas/CityCode'}
        cityCodeName: {type: string}
        recommendedProductCode: {$ref: '#/components/schemas/RecommendedProductCode'}
        recommendedProductName: {type: string}
        styleMood: {$ref: '#/components/schemas/StyleMoodCode'}
        styleMoodName: {type: string}
        backgroundCode: {$ref: '#/components/schemas/CityBackgroundCode'}
        backgroundName: {type: string}
        backgroundAssetKey: {type: string}
        journeyStamps:
          type: array
          description: Journey Stamp의 Spot code 목록이며 항상 배열로 반환합니다.
          items: {type: string}
        taggedProductCodes:
          type: array
          description: 태그한 Product가 없으면 빈 배열을 반환합니다.
          items: {type: string}
        createdAt: {type: string, format: date-time}
    JourneyDataSnapshot:
      type: object
      required: [sessionId, responses, stamps, taggedProducts]
      properties:
        sessionId: {type: integer, format: int64}
        responses:
          type: array
          items: {$ref: '#/components/schemas/JourneyResponseSignal'}
        stamps:
          type: array
          items: {$ref: '#/components/schemas/JourneyStampSignal'}
        taggedProducts:
          type: array
          items: {$ref: '#/components/schemas/JourneyProductSignal'}
    JourneyResponseSignal:
      type: object
      required: [spotCode, questionCode, answerCode, answerText]
      properties:
        spotCode: {type: string}
        questionCode: {type: string}
        answerCode: {type: string}
        answerText: {type: string}
    JourneyStampSignal:
      type: object
      required: [spotCode]
      properties:
        spotCode: {type: string}
    JourneyProductSignal:
      type: object
      required: [productId, code, name]
      properties:
        productId: {type: integer, format: int64}
        code: {type: string}
        name: {type: string}
    MyPassportResponse:
      type: object
      description: COMPLETED 이전에도 조회 가능한 현재 Passport Session의 aggregate입니다.
      required:
        - passportSessionId
        - cardUid
        - status
        - startedAt
        - completedAt
        - journey
        - styleResult
        - portrait
        - souvenir
      properties:
        passportSessionId: {type: integer, format: int64}
        cardUid: {type: string}
        status: {$ref: '#/components/schemas/PassportSessionStatus'}
        startedAt: {type: string, format: date-time}
        completedAt:
          type: [string, 'null']
          format: date-time
          description: COMPLETED 이전에는 null입니다.
        journey: {$ref: '#/components/schemas/JourneyDataSnapshot'}
        styleResult:
          description: Style 분석 성공 전에는 null입니다.
          oneOf:
            - $ref: '#/components/schemas/StyleResultResponse'
            - type: 'null'
        portrait:
          description: 선택 기능이므로 저장하지 않았거나 삭제한 경우 null입니다.
          oneOf:
            - $ref: '#/components/schemas/StylePortraitResponse'
            - type: 'null'
        souvenir:
          description: Journey Souvenir 생성 전에는 null입니다.
          oneOf:
            - $ref: '#/components/schemas/JourneySouvenirResponse'
            - type: 'null'
    ErrorResponse:
      type: object
      required: [timestamp, status, code, message, path, errors]
      properties:
        timestamp: {type: string, format: date-time}
        status: {type: integer, example: 404}
        code: {type: string, example: PASSPORT_SESSION_NOT_FOUND}
        message: {type: string}
        path: {type: string}
        errors:
          type: array
          description: Field validation 오류 목록이며 validation 오류가 없으면 빈 배열입니다.
          items:
            type: object
            required: [field, reason]
            properties:
              field: {type: string}
              reason: {type: string}
